[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonclaw"
version = "0.1.0"
description = "AI-powered OpenClaw installer, configurator, and doctor agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DragonClaw Maintainers" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "questionary>=2.0",
]

[project.optional-dependencies]
runtime = [
  "torch",
  "transformers>=4.41",
  "accelerate>=0.30",
]
dev = [
  "pytest>=8.2",
]

[project.scripts]
dragonclaw = "dragonclaw.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dragonclaw = ["artifacts/*.json", "artifacts/README.md", "scripts/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_openclaw_validate: test supplies its own openclaw config validate mocking",
  "real_openclaw_cli: test calls real openclaw CLI subprocesses (opt-in integration)",
]
